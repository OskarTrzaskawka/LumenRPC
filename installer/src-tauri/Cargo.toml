[package]
name = "lumen-setup"
version = "0.1.0"
description = "Lumen RPC Lite Setup — downloads and installs the latest Lumen RPC release"
authors = ["Oskar Trzaskawka"]
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

# Keep the web installer as small as possible.
[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
