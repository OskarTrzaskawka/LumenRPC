name: Release

# Push a tag like `v0.2.0` to build both Windows installers and attach them to a draft GitHub release.
# Or run it by hand (Actions → Release → Run workflow) to rebuild an existing release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and upload to, e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  DRAFT: ${{ github.event_name == 'push' }}

jobs:
  windows:
    name: Windows installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            installer/src-tauri -> target

      - run: npm ci

      - name: Full installer (.exe + .msi)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: Lumen RPC ${{ env.TAG }}
          releaseBody: |
            ## Download (Windows 10/11)

            | Installer | File |
            | --- | --- |
            | Full (offline) | `Lumen.RPC_*_x64-setup.exe` or `Lumen.RPC_*_x64_en-US.msi` |
            | Lite (downloads the latest version) | `LumenRPC-Lite-Setup-windows-x64.exe` |

            Made by [Oskar Trzaskawka](https://github.com/OskarTrzaskawka).
          releaseDraft: ${{ env.DRAFT == 'true' }}
          prerelease: false

      - name: Lite installer
        working-directory: installer
        shell: bash
        run: |
          node ../node_modules/@tauri-apps/cli/tauri.js build --no-bundle
          mkdir -p ../out
          cp src-tauri/target/release/LumenRPC-Lite-Setup.exe ../out/LumenRPC-Lite-Setup-windows-x64.exe

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          draft: ${{ env.DRAFT == 'true' }}
          files: out/*
