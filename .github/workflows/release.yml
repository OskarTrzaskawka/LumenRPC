name: Release

# Push a tag like `v0.1.0` to build every installer and attach them to a draft GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  full:
    name: Full installer (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ""
          - name: macOS Apple Silicon
            os: macos-latest
            args: "--target aarch64-apple-darwin"
          - name: macOS Intel
            os: macos-latest
            args: "--target x86_64-apple-darwin"
          - name: Linux
            os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Lumen RPC ${{ github.ref_name }}
          releaseBody: |
            ## Download

            | | Full installer (offline) | Lite installer (downloads the latest version) |
            | --- | --- | --- |
            | Windows | `Lumen.RPC_*_x64-setup.exe` or `.msi` | `LumenRPC-Lite-Setup-windows-x64.exe` |
            | macOS | `Lumen.RPC_*_aarch64.dmg` (Apple Silicon) / `_x64.dmg` (Intel) | `LumenRPC-Lite-Setup-macos-universal.dmg` |
            | Linux | `.AppImage`, `.deb` or `.rpm` | `LumenRPC-Lite-Setup-linux-x86_64.AppImage` |

            Made by [Oskar Trzaskawka](https://github.com/OskarTrzaskawka).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  lite:
    name: Lite installer (${{ matrix.name }})
    needs: full
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: installer/src-tauri -> target

      - run: npm ci

      - name: Build (Windows, single portable exe)
        if: runner.os == 'Windows'
        working-directory: installer
        shell: bash
        run: |
          node ../node_modules/@tauri-apps/cli/tauri.js build --no-bundle
          mkdir -p ../out
          cp src-tauri/target/release/LumenRPC-Lite-Setup.exe ../out/LumenRPC-Lite-Setup-windows-x64.exe

      - name: Build (macOS, universal dmg)
        if: runner.os == 'macOS'
        working-directory: installer
        run: |
          node ../node_modules/@tauri-apps/cli/tauri.js build --target universal-apple-darwin --bundles dmg
          mkdir -p ../out
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg ../out/LumenRPC-Lite-Setup-macos-universal.dmg

      - name: Build (Linux, AppImage)
        if: runner.os == 'Linux'
        working-directory: installer
        run: |
          node ../node_modules/@tauri-apps/cli/tauri.js build --bundles appimage
          mkdir -p ../out
          cp src-tauri/target/release/bundle/appimage/*.AppImage ../out/LumenRPC-Lite-Setup-linux-x86_64.AppImage

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: out/*
