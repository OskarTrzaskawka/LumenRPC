name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            installer/src-tauri -> target
      - run: npm ci
      - name: Type-check and build the UI
        run: npm run build
      - name: Check the app
        working-directory: src-tauri
        run: cargo check --locked
      - name: Check the lite installer
        working-directory: installer/src-tauri
        run: cargo check --locked
